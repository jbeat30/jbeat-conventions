# hotfix/vX.Y.Z 가 main 에 머지되면,
# 진행 중인 feature/vX.Y.Z, release/vX.Y.Z 브랜치로 가는 백머지 PR(main → 해당 브랜치)을 자동으로 연다.

name: auto-back-merge

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: read
  pull-requests: write
  statuses: write

jobs:
  open-prs:
    name: open-prs
    if: github.event.pull_request.merged == true && startsWith(github.event.pull_request.head.ref, 'hotfix/')
    runs-on: ubuntu-latest
    steps:
      - name: 백머지 PR 생성
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          HOTFIX: ${{ github.event.pull_request.head.ref }}
        shell: bash
        run: |
          main_sha=$(gh api "repos/${REPO}/commits/${DEFAULT_BRANCH}" --jq .sha)

          # GITHUB_TOKEN 으로 만든 PR 에서는 다른 워크플로가 돌지 않으므로,
          # 필수 체크(branch-policy / check)를 여기서 직접 통과 처리한다. (main → feature/release 는 허용된 방향)
          gh api -X POST "repos/${REPO}/statuses/${main_sha}" \
            -f state=success -f context="branch-policy / check" \
            -f description="auto back-merge (${HOTFIX})" > /dev/null

          branches=$(gh api --paginate "repos/${REPO}/branches?per_page=100" --jq '.[].name' \
            | grep -E '^(feature|release)/v[0-9]+\.[0-9]+\.[0-9]+$' || true)

          if [[ -z "$branches" ]]; then
            echo "진행 중인 feature/release 브랜치가 없어 백머지를 건너뜁니다."
            exit 0
          fi

          hotfix_ver="${HOTFIX#hotfix/v}"
          for base in $branches; do
            # hotfix 보다 높은 버전(아직 개발 중인 버전)에만 백머지한다. 이미 배포된 옛 브랜치는 건너뜀
            base_ver="${base#*/v}"
            if [[ "$(printf '%s\n%s\n' "$base_ver" "$hotfix_ver" | sort -V | tail -n1)" != "$base_ver" || "$base_ver" == "$hotfix_ver" ]]; then
              echo "- ${base}: 지난 버전이라 건너뜀"
              continue
            fi
            ahead=$(gh api "repos/${REPO}/compare/${base}...${DEFAULT_BRANCH}" --jq .ahead_by)
            if [[ "$ahead" == "0" ]]; then
              echo "- ${base}: 이미 반영됨"
              continue
            fi
            existing=$(gh pr list -R "$REPO" --base "$base" --head "$DEFAULT_BRANCH" --state open --json number --jq '.[0].number')
            if [[ -n "$existing" ]]; then
              echo "- ${base}: 이미 열린 백머지 PR #${existing}"
              continue
            fi
            gh pr create -R "$REPO" --base "$base" --head "$DEFAULT_BRANCH" \
              --title "chore: back-merge ${HOTFIX} into ${base}" \
              --body "$(printf '%s 가 %s 에 머지되어 자동으로 생성된 백머지 PR 입니다.\n\n⚠️ 반드시 **Create a merge commit** 으로 머지하세요. (Squash 금지)\n\n충돌이 있으면 로컬에서 해결하세요:\n```bash\ngit fetch origin\ngit switch -c chore/back-merge-%s origin/%s\ngit merge origin/%s\ngit push -u origin chore/back-merge-%s\n```\n그 후 이 PR 은 닫고 chore/back-merge-%s → %s PR 을 머지합니다.' \
                "$HOTFIX" "$DEFAULT_BRANCH" "${HOTFIX#hotfix/}" "$base" "$DEFAULT_BRANCH" "${HOTFIX#hotfix/}" "${HOTFIX#hotfix/}" "$base")"
            echo "- ${base}: 백머지 PR 생성"
          done
