# release/vX.Y.Z (또는 hotfix/vX.Y.Z) PR 이 main 에 머지되면 vX.Y.Z 태그와 GitHub 릴리즈를 생성한다.
name: publish-release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: publish-release-${{ github.sha }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_SHA: ${{ github.sha }}
    steps:
      - name: main 에 머지된 release/hotfix PR 확인
        id: source
        shell: bash
        run: |
          set -euo pipefail
          branch=$(gh api "repos/${GH_REPO}/commits/${RELEASE_SHA}/pulls" --jq \
            '.[] | select(.merged_at != null and .base.ref == "main") | select(.merge_commit_sha == env.RELEASE_SHA) | .head.ref' \
            | grep -E '^(release|hotfix)/v[0-9]+\.[0-9]+\.[0-9]+$' || true)
          if [[ -z "$branch" ]]; then
            echo '릴리즈 PR 머지가 아니므로 생성하지 않습니다.'
            exit 0
          fi
          [[ "$branch" != *$'\n'* ]]
          echo "tag=${branch#*/}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7.0.1
        if: steps.source.outputs.tag != ''
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: plugin.json 버전 검사
        if: steps.source.outputs.tag != ''
        env:
          RELEASE_TAG: ${{ steps.source.outputs.tag }}
        run: |
          set -euo pipefail
          plugin_version=$(jq -r .version .claude-plugin/plugin.json)
          [[ "v${plugin_version}" == "$RELEASE_TAG" ]] || { echo "plugin.json(${plugin_version}) 과 ${RELEASE_TAG} 불일치"; exit 1; }

      - name: 태그와 릴리즈 생성
        if: steps.source.outputs.tag != ''
        env:
          RELEASE_TAG: ${{ steps.source.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          # 기존 태그는 이동하지 않습니다. 커밋 불일치는 실패로 처리합니다.
          if gh api "repos/${GH_REPO}/git/ref/tags/${RELEASE_TAG}" >/dev/null 2>&1; then
            tag_sha=$(gh api "repos/${GH_REPO}/commits/${RELEASE_TAG}" --jq .sha)
            [[ "$tag_sha" == "$RELEASE_SHA" ]] || { echo '태그 커밋 불일치'; exit 1; }
          fi
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo '이미 생성된 릴리즈입니다.'
            exit 0
          fi
          gh release create "$RELEASE_TAG" --target "$RELEASE_SHA" \
            --title "$RELEASE_TAG" --generate-notes --latest

      - name: 마켓플레이스 ref 갱신 PR 생성
        if: steps.source.outputs.tag != ''
        env:
          RELEASE_TAG: ${{ steps.source.outputs.tag }}
          MARKETPLACE_TOKEN: ${{ secrets.MARKETPLACE_TOKEN }}
          PLUGIN_NAME: jbeat-conventions
          MARKETPLACE_REPO: jbeat30/jbeat-plugins
        shell: bash
        run: |
          set -euo pipefail
          # 마켓플레이스 저장소 쓰기 토큰이 없으면 생략, 수동 갱신 필요
          if [[ -z "$MARKETPLACE_TOKEN" ]]; then
            echo "::warning::MARKETPLACE_TOKEN 시크릿 없음, ${MARKETPLACE_REPO}의 ${PLUGIN_NAME} ref를 ${RELEASE_TAG}로 직접 갱신 필요"
            exit 0
          fi
          export GH_TOKEN="$MARKETPLACE_TOKEN"
          git clone --depth 1 "https://x-access-token:${MARKETPLACE_TOKEN}@github.com/${MARKETPLACE_REPO}.git" marketplace
          cd marketplace
          file=.claude-plugin/marketplace.json
          jq --arg n "$PLUGIN_NAME" --arg t "$RELEASE_TAG" \
            '(.plugins[] | select(.name == $n) | .source.ref) = $t' "$file" > "$file.tmp"
          mv "$file.tmp" "$file"
          if git diff --quiet; then
            echo 'ref 변경 없음'
            exit 0
          fi
          branch="chore/${PLUGIN_NAME}-${RELEASE_TAG}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "$branch"
          git commit -am "chore: ${PLUGIN_NAME} ${RELEASE_TAG} 반영"
          git push origin "$branch"
          gh pr create --repo "$MARKETPLACE_REPO" --base main --head "$branch" \
            --title "chore: ${PLUGIN_NAME} ${RELEASE_TAG} 반영" \
            --body "${PLUGIN_NAME} 릴리즈 ${RELEASE_TAG} 생성에 따른 마켓플레이스 ref 갱신"
